apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: appworld-internal-only
  namespace: trace-replay
spec:
  podSelector:
    matchLabels:
      app: appworld
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trace-replay
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshell-tracesim
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trace-replay
      ports:
        - protocol: TCP
          port: 8090
