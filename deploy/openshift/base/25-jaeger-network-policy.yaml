apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-internal-only
  namespace: trace-replay
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trace-replay
      ports:
        - protocol: TCP
          port: 16686
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
