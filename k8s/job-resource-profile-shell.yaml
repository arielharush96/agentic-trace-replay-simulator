apiVersion: batch/v1
kind: Job
metadata:
  name: trace-replay-resource-profile-shell
  namespace: trace-replay
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: driver
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              exec python /app/driver.py \
                --corpus /data/replay.json \
                --out /results \
                --layer shell \
                --url http://openclaw-shell.trace-replay.svc.cluster.local:18790 \
                --model openclaw/perf_agent \
                --token change-me-gateway-token \
                --concurrency "${CONCURRENCY:-1}" \
                --timeout 900 \
                --stream
          env:
            - name: CONCURRENCY
              value: "1"
          volumeMounts:
            - name: src
              mountPath: /app
            - name: corpus
              mountPath: /data
            - name: results
              mountPath: /results
      volumes:
        - name: src
          configMap:
            name: profiler-v3-driver-src
        - name: corpus
          configMap:
            name: profiler-v3-corpus
        - name: results
          emptyDir: {}
