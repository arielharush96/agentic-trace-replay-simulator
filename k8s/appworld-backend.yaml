apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-replay-appworld-backend
  labels:
    managed-by: trace-replay-experiment
    component: workload-backend
    workload: personal_assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-replay-appworld-backend
  template:
    metadata:
      labels:
        app: trace-replay-appworld-backend
        managed-by: trace-replay-experiment
        component: workload-backend
        workload: personal_assistant
    spec:
      containers:
        - name: appworld
          image: ghcr.io/stonybrooknlp/appworld:latest
          command: ["/opt/venv/bin/python"]
          args: ["/app/appworld_service.py", "--root", "/appworld", "--task-map", "/config/session-task-map.json", "--port", "8090"]
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: source
              mountPath: /app/appworld_service.py
              subPath: appworld_service.py
              readOnly: true
            - name: appworld-data
              mountPath: /appworld
            - name: task-map
              mountPath: /config
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: trace-replay-appworld-backend-src
        - name: appworld-data
          persistentVolumeClaim:
            claimName: trace-replay-appworld-data
        - name: task-map
          secret:
            secretName: trace-replay-appworld-task-map
---
apiVersion: v1
kind: Service
metadata:
  name: trace-replay-appworld-backend
  labels:
    managed-by: trace-replay-experiment
    component: workload-backend
    workload: personal_assistant
spec:
  selector:
    app: trace-replay-appworld-backend
  ports:
    - name: http
      port: 8090
      targetPort: http
