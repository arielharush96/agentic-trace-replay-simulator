apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-replay-tau2-backend
  namespace: trace-replay
  labels:
    app: trace-replay-tau2-backend
    managed-by: trace-replay-experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-replay-tau2-backend
  template:
    metadata:
      labels:
        app: trace-replay-tau2-backend
        managed-by: trace-replay-experiment
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/domain_backend.py"]
          args: ["--workload", "customer_support_ops", "--port", "8094"]
          ports:
            - name: http
              containerPort: 8094
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: source, mountPath: /app, readOnly: true}
            - {name: sessions, mountPath: /data/sessions}
      volumes:
        - name: source
          configMap:
            name: trace-replay-tau2-backend-src
        - name: sessions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trace-replay-tau2-backend
  namespace: trace-replay
  labels:
    app: trace-replay-tau2-backend
    managed-by: trace-replay-experiment
spec:
  selector:
    app: trace-replay-tau2-backend
  ports:
    - name: http
      port: 8094
      targetPort: http
