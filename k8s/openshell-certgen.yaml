apiVersion: batch/v1
kind: Job
metadata:
  name: trace-replay-openshell-certgen
  namespace: trace-replay-openshell-tracesim
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: trace-replay-openshell
    managed-by: trace-replay-experiment
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell
        app.kubernetes.io/instance: trace-replay-openshell
        managed-by: trace-replay-experiment
    spec:
      restartPolicy: OnFailure
      serviceAccountName: trace-replay-openshell-certgen
      containers:
        - name: certgen
          image: ghcr.io/nvidia/openshell/gateway:0.0.116
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/usr/local/bin/openshell-gateway"]
          args:
            - generate-certs
            - --server-secret-name=openshell-server-tls
            - --client-secret-name=openshell-client-tls
            - --jwt-secret-name=trace-replay-openshell-jwt-keys
            - --namespace=trace-replay-openshell-tracesim
            - --server-san=trace-replay-openshell
            - --server-san=trace-replay-openshell.trace-replay-openshell-tracesim.svc
            - --server-san=trace-replay-openshell.trace-replay-openshell-tracesim.svc.cluster.local
            - --server-san=localhost
            - --server-san=trace-replay-openshell.localhost
            - --server-san=*.trace-replay-openshell.localhost
            - --server-san=host.docker.internal
            - --server-san=host.containers.internal
            - --server-san=127.0.0.1
