# Optional. Scrapes cAdvisor at 1s for the trace-replay and openshell-tracesim
# namespaces, in addition to the platform's 30s interval. Creating the Secret
# changes nothing by itself: reference it under prometheusK8s.additionalScrapeConfigs
# in the existing cluster-monitoring-config ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: trace-replay-additional-scrape
  namespace: openshift-monitoring
stringData:
  trace-replay.yaml: |
    - job_name: cadvisor-trace-replay-1s
      scrape_interval: 1s
      scrape_timeout: 1s
      honor_labels: true
      metrics_path: /metrics/cadvisor
      scheme: https
      tls_config:
        insecure_skip_verify: true
      authorization:
        type: Bearer
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__address__]
          regex: '(.+):(.+)'
          replacement: '${1}:10250'
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
      metric_relabel_configs:
        - source_labels: [namespace]
          regex: "trace-replay|openshell-tracesim"
          action: keep
