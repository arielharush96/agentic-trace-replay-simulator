apiVersion: batch/v1
kind: Job
metadata:
  name: trace-replay-driver
  namespace: trace-replay
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: trace-replay-driver
    spec:
      restartPolicy: Never
      containers:
        - name: driver
          image: python:3.12-slim
          command: ["python", "/app/driver.py"]
          args:
            - --corpus
            - /data/replay.json
            - --out
            - /results
            - --layer
            - $(LAYER)
            - --url
            - $(TARGET_URL)
            - --model
            - $(MODEL)
            - --token
            - $(TOKEN)
            - --concurrency
            - $(CONCURRENCY)
            - --limit
            - $(LIMIT)
          env:
            - name: LAYER
              value: mock-direct
            - name: TARGET_URL
              value: http://mock-llm.trace-replay.svc.cluster.local:8080
            - name: MODEL
              value: replay
            - name: TOKEN
              value: ""
            - name: CONCURRENCY
              value: "1"
            - name: LIMIT
              value: "20"
          volumeMounts:
            - name: src
              mountPath: /app
            - name: corpus
              mountPath: /data
            - name: results
              mountPath: /results
      volumes:
        - name: src
          configMap:
            name: driver-src
        - name: corpus
          configMap:
            name: replay-corpus
        - name: results
          emptyDir: {}
